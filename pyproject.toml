[project]
name = "bulletrix"
version = "0.1.0"
description = "A keyboard-driven, zoomable outliner for the terminal, built with Textual."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.58.0",
]

[project.scripts]
bulletrix = "bulletrix.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulletrix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
